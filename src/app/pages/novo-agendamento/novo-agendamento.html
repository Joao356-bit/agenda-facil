<div class="agendamento-container">

  <div class="top-area">

    <div>

      <h1>
        Novo Agendamento
      </h1>

      <p>
        Cadastre um novo atendimento no sistema.
      </p>

    </div>

  </div>

  <div class="agendamento-card">

    <div class="form-grid">

      <div class="input-group">

        <label>
          Cliente
        </label>

        <input
          type="text"
          placeholder="Digite o nome do cliente"
          [(ngModel)]="agendamento.cliente"
        >

      </div>

      <div class="input-group">

        <label>
          Data
        </label>

        <input
          type="date"
          [(ngModel)]="agendamento.data"
        >

      </div>

      <div class="input-group">

        <label>
          Hora
        </label>

        <input
          type="time"
          [(ngModel)]="agendamento.hora"
        >

      </div>

      <div class="input-group">

        <label>
          Serviço
        </label>

        <input
          type="text"
          placeholder="Digite o serviço"
          [(ngModel)]="agendamento.servico"
        >

      </div>

      <div class="input-group">

        <label>
          Profissional
        </label>

        <select
          [(ngModel)]="agendamento.profissional_id"
        >

          <option value="">
            Selecione um profissional
          </option>

          <option
            *ngFor="let profissional of profissionais"
            [value]="profissional.id"
          >

            {{ profissional.nome }}

          </option>

        </select>

      </div>

    </div>

    <button
      class="save-btn"
      (click)="salvarAgendamento()"
    >

      Salvar Agendamento

    </button>

  </div>

</div>
