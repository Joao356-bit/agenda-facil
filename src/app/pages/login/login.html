<div class="login-container">

  <div class="login-left">

    <div class="left-content">

      <h1>
        Agenda+
      </h1>

      <p>
        Organize seus agendamentos,
        profissionais e clientes
        em um único sistema moderno.
      </p>

    </div>

  </div>

  <div class="login-right">

    <div class="login-card">

      <h2>
        Entrar
      </h2>

      <p>
        Faça login para acessar
        sua plataforma.
      </p>

      <form
        [formGroup]="loginForm"
        (ngSubmit)="onSubmit()"
      >

        <div class="input-group">

          <label>
            E-mail
          </label>

          <input
            type="email"
            placeholder="Digite seu e-mail"
            formControlName="email"
          >

          <div
            class="error-message"
            *ngIf="
              loginForm
              .get('email')
              ?.invalid
              &&
              loginForm
              .get('email')
              ?.touched
            "
          >

            E-mail inválido

          </div>

        </div>

        <div class="input-group">

          <label>
            Senha
          </label>

          <input
            type="password"
            placeholder="Digite sua senha"
            formControlName="senha"
          >

          <div
            class="error-message"
            *ngIf="
              loginForm
              .get('senha')
              ?.invalid
              &&
              loginForm
              .get('senha')
              ?.touched
            "
          >

            Senha inválida

          </div>

        </div>

        <div class="links">

          <a
            (click)="esqueciSenha()"
          >
            Esqueci minha senha
          </a>

          <a
            routerLink="/cadastro"
          >
            Criar conta
          </a>

        </div>

        <button
          class="login-btn"
          type="submit"
        >

          {{ carregando
            ? 'Entrando...'
            : 'Entrar'
          }}

        </button>

      </form>

    </div>

  </div>

</div>
