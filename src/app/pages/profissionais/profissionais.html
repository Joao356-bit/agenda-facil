<div class="profissionais-container">

  <div class="top-area">

    <div>

      <h1>
        Profissionais
      </h1>

      <p>
        Gerencie os profissionais cadastrados
        no sistema.
      </p>

    </div>

  </div>

  <div class="table-container">

    <div class="form-grid">

      <div class="input-group">

        <label>
          Nome
        </label>

        <input
          type="text"
          placeholder="Digite o nome"
          [(ngModel)]="novoProfissional.nome"
        >

      </div>

      <div class="input-group">

        <label>
          Especialidade
        </label>

        <input
          type="text"
          placeholder="Digite a especialidade"
          [(ngModel)]="novoProfissional.especialidade"
        >

      </div>

      <div class="input-group">

        <label>
          Telefone
        </label>

        <input
          type="text"
          placeholder="Digite o telefone"
          [(ngModel)]="novoProfissional.telefone"
        >

      </div>

    </div>

    <button
      class="novo-btn"
      (click)="adicionarProfissional()"
    >

      Adicionar Profissional

    </button>

  </div>

  <div class="table-container">

    <table>

      <thead>

        <tr>

          <th>
            Nome
          </th>

          <th>
            Especialidade
          </th>

          <th>
            Telefone
          </th>

          <th>
            Ações
          </th>

        </tr>

      </thead>

      <tbody>

        <tr
          *ngFor="
          let profissional of profissionais
          "
        >

          <td>
            {{ profissional.nome }}
          </td>

          <td>
            {{ profissional.especialidade }}
          </td>

          <td>
            {{ profissional.telefone }}
          </td>

          <td>

            <div class="actions">

              <button
                class="delete-btn"
                (click)="
                excluirProfissional(
                  profissional.id
                )
                "
              >

                Excluir

              </button>

            </div>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>
