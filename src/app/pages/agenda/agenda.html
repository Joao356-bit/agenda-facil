<div class="agenda-container">

  <div class="calendar-card">

    <div class="calendar-header">

      <h2>
        Calendário
      </h2>

    </div>

    <div class="calendar-grid">

      <div class="week-day">D</div>
      <div class="week-day">S</div>
      <div class="week-day">T</div>
      <div class="week-day">Q</div>
      <div class="week-day">Q</div>
      <div class="week-day">S</div>
      <div class="week-day">S</div>

      <div class="day">1</div>
      <div class="day">2</div>
      <div class="day">3</div>
      <div class="day">4</div>
      <div class="day active-day">5</div>
      <div class="day">6</div>
      <div class="day">7</div>

      <div class="day">8</div>
      <div class="day">9</div>
      <div class="day">10</div>
      <div class="day">11</div>
      <div class="day">12</div>
      <div class="day">13</div>
      <div class="day">14</div>

    </div>

  </div>

  <div class="schedule-card">

    <div class="schedule-header">

      <div>

        <h1>
          Agenda
        </h1>

        <p>
          Visualize os agendamentos do sistema.
        </p>

      </div>

      <button
        class="novo-btn"
        routerLink="/novo-agendamento"
      >

        Novo Agendamento

      </button>

    </div>

    <div class="schedule-list">

      <div
        class="schedule-item"

        *ngFor="
        let agendamento of agendamentos
        "
      >

        <div class="time">

          {{ agendamento.hora }}

        </div>

        <div class="info">

          <h3>

            {{ agendamento.cliente }}

          </h3>

          <p>

            Serviço:
            {{ agendamento.servico }}

          </p>

          <p>

            Profissional:
            {{ agendamento.profissional }}

          </p>

          <p>

            {{ agendamento.data }}

          </p>

        </div>

        <button
          class="novo-btn"
          (click)="
          excluirAgendamento(
            agendamento.id
          )
          "
        >

          Excluir

        </button>

      </div>

    </div>

  </div>

</div>
