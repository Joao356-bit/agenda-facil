<div class="dashboard-container">

  <h1>
    Dashboard
  </h1>

  <div class="cards">

    <div class="card">

      <h2>
        Agendamentos
      </h2>

      <div class="card-number">

        {{ dados.totalAgendamentos }}

      </div>

    </div>

    <div class="card">

      <h2>
        Profissionais
      </h2>

      <div class="card-number">

        {{ dados.totalProfissionais }}

      </div>

    </div>

  </div>

  <div class="recentes">

    <h2>
      Agendamentos Recentes
    </h2>

    <div

      class="item"

      *ngFor="
      let item of dados.recentes
      "

    >

      <strong>

        {{ item.cliente }}

      </strong>

      -

      às

      {{ item.hora }}

    </div>

  </div>

</div>
